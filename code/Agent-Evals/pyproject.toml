[project]
name = "support-agent-byoe"
version = "0.1.0"
description = "Local customer-support agent with bring-your-own evaluations"
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]