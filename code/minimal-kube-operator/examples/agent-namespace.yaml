# Example of an in-scope agent namespace with its single pre-existing service
# account, plus an agent Deployment carrying the blueprint annotation.
apiVersion: v1
kind: Namespace
metadata:
  name: agents-payments
  labels:
    agent-enabled: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-agent-sa
  namespace: agents-payments
  annotations:
    # Assumed to already be wired to the Agent Identity Blueprint, e.g. via
    # AKS workload identity.
    azure.workload.identity/client-id: 078956a8-3627-4b4d-8fc4-f1762594c7de
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-agent
  namespace: agents-payments
  annotations:
    agent.blueprint/id: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-agent
  template:
    metadata:
      labels:
        app: payments-agent
      annotations:
        # Recommended: repeat the ID on the pod template so the webhook resolves
        # it without an extra ReplicaSet/Deployment lookup. The operator works
        # either way.
        agent.blueprint/id: 14e4fa79-3345-461d-b0ad-76f19f2526db
    spec:
      serviceAccountName: payments-agent-sa
      containers:
        - name: agent
          image: mcr.microsoft.com/cbl-mariner/busybox:2.0
          command: ["/bin/sh", "-c"]
          args:
            - 'echo "AGENT_IDENTITY_ID=$AGENT_IDENTITY_ID"; sleep 3600'
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
