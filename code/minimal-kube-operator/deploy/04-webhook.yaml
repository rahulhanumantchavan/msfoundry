apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: agent-identity-operator-mutating-webhook
  labels:
    app.kubernetes.io/name: agent-identity-operator
webhooks:
  - name: pods.agent-identity.contoso.io
    admissionReviewVersions: ["v1"]
    sideEffects: NoneOnDryRun
    # Fail is what guarantees the requirement "pod starts only after all
    # operations complete successfully". If the operator is down or the
    # blueprint API call fails, the pod is rejected and never starts.
    failurePolicy: Fail
    reinvocationPolicy: Never
    timeoutSeconds: 20
    matchPolicy: Equivalent
    clientConfig:
      service:
        name: agent-identity-operator-webhook
        namespace: agent-operator-system
        path: /mutate-v1-pod
        port: 443
      # caBundle is injected at runtime by the operator's cert bootstrap.
      caBundle: ""
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: Namespaced
    # Only namespaces explicitly labelled agent-enabled=true are in scope.
    namespaceSelector:
      matchExpressions:
        - key: agent-enabled
          operator: In
          values: ["true"]
        # Never intercept the operator's own namespace or kube-system.
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["agent-operator-system", "kube-system"]
    objectSelector:
      matchExpressions:
        # Escape hatch for break-glass workloads.
        - key: agent.blueprint/skip
          operator: NotIn
          values: ["true"]
